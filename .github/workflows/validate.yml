name: Validate preview
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-release.mjs
      - run: node scripts/check-backup.mjs
      - run: node scripts/check-choice-map.mjs
      - run: node scripts/check-execution.mjs
      - run: node scripts/audit-public.mjs
