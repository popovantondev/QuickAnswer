<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Answer</title><style>html,body{margin:0;padding:0;background:#f3f5f9;border-radius:18px;overflow:hidden;}body{color:#17243a;font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;}</style><link rel="stylesheet" href="popup.css"></head><body data-theme="light">
<main class="quick" aria-label="Quick Answer"><header class="top"><div class="brand"><img class="brand-icon" src="icons/quickanswer.svg" width="54" height="54" alt=""><div class="brand-text"><div class="brand-name">Quick Answer <span class="version">v 1.7.8</span></div><p data-i18n="tagline">Вопрос → ответ, без лишних шагов</p></div></div><button id="settingsTop" class="icon-button" type="button" aria-label="Настройки" title="Настройки"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 13.7 2.3 14.3 4.6 16 5.6 18.2 4.9 19.6 6.4 18.9 8.7 20 10.3 22 10.7 22 13.3 20 13.7 18.9 15.3 19.6 17.6 18.2 19.1 16 18.4 14.3 19.4 13.7 21.7 12 22 10.3 21.7 9.7 19.4 8 18.4 5.8 19.1 4.4 17.6 5.1 15.3 4 13.7 2 13.3 2 10.7 4 10.3 5.1 8.7 4.4 6.4 5.8 4.9 8 5.6 9.7 4.6 10.3 2.3Z"/><circle cx="12" cy="12" r="3"/></svg></button></header>
<div class="status-line" id="status" role="status" aria-live="polite" data-i18n="loading">Загрузка…</div>
<section class="controls"><div class="control-row"><label for="provider" data-i18n="provider">Приоритет моделей</label><select id="provider"><option value="auto" data-i18n="providerAuto">АВТО · Groq → Gemini → ChatGPT</option><option value="groq" data-i18n="onlyGroq">Только Groq</option><option value="gemini" data-i18n="onlyGemini">Только Gemini</option><option value="luna" data-i18n="onlyLuna">Только ChatGPT</option></select></div>
<div class="control-row"><label for="mode" data-i18n="testType">Тип теста</label><select id="mode"><option value="auto" data-i18n="auto">АВТО</option><option value="test" data-i18n="test">Обычный тест</option><option value="kahoot" data-i18n="kahoot">Kahoot</option></select></div>
<div class="control-row"><label for="reasoning" data-i18n="thinking">Рассуждения</label><select id="reasoning"><option value="fast" data-i18n="fast">Быстро</option><option value="balanced" data-i18n="balanced">Баланс (low)</option><option value="deep" data-i18n="deep">Глубже</option></select></div></section>
<section class="action-grid" aria-label="Быстрые действия"><button id="dom" class="action"><span class="action-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2.5h8l4 4V21H6Z"/><path d="M14 2.5v4h4M9 11h6M9 15h6M9 18h4"/></svg></span><span class="action-body"><strong data-i18n="text">Текст</strong><kbd>Ctrl+Shift+1</kbd></span><span class="arrow">›</span></button><button id="shot" class="action"><span class="action-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h4l2-2h6l2 2h4v12H3Z"/><circle cx="12" cy="13" r="3.1"/></svg></span><span class="action-body"><strong data-i18n="screenshot">Снимок</strong><kbd>Ctrl+Shift+2</kbd></span><span class="arrow">›</span></button><button id="region" class="action"><span class="action-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="3 3" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="1.5"/></svg></span><span class="action-body"><strong data-i18n="region">Область</strong><kbd>Ctrl+Shift+4</kbd></span><span class="arrow">›</span></button><button id="desktop" class="action"><span class="action-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg></span><span class="action-body"><strong data-i18n="anotherWindow">Другое окно</strong><span class="action-sub">Edge</span></span><span class="arrow">›</span></button></section>
<section class="secondary-actions"><button id="retry" class="secondary"><span class="secondary-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 9a8 8 0 0 0-13.4-3L4 8.5M4 3.5v5h5M4 15a8 8 0 0 0 13.4 3L20 15.5M20 20.5v-5h-5"/></svg></span><span data-i18n="anotherModel">Другая модель</span></button><button id="settings" class="secondary primary"><span class="secondary-icon"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 13.7 2.3 14.3 4.6 16 5.6 18.2 4.9 19.6 6.4 18.9 8.7 20 10.3 22 10.7 22 13.3 20 13.7 18.9 15.3 19.6 17.6 18.2 19.1 16 18.4 14.3 19.4 13.7 21.7 12 22 10.3 21.7 9.7 19.4 8 18.4 5.8 19.1 4.4 17.6 5.1 15.3 4 13.7 2 13.3 2 10.7 4 10.3 5.1 8.7 4.4 6.4 5.8 4.9 8 5.6 9.7 4.6 10.3 2.3Z"/><circle cx="12" cy="12" r="3"/></svg></span><span data-i18n="settings">Настройки и ключи</span></button></section>
<footer><span id="stats" data-i18n="statsLoading">Запросы — · время —</span><div class="foot-locale" role="group" aria-label="Language"><button data-lang="ru" lang="ru">RU</button><button data-lang="de" lang="de">DE</button><button data-lang="en" lang="en">EN</button></div><button id="shortcuts" type="button" data-i18n="shortcuts">Клавиши</button></footer></main>
<script src="i18n.js"></script><script src="popup.js"></script></body></html>
